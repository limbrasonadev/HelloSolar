<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Log in to your Hello Solar customer portal account to view solar production, savings, and payments.">
    <title>Hello Solar — Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Favicon / Tab Icon -->
    <link rel="icon" type="image/png" href="assets/images/logofortab.png">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="css/portal.css">

    <link rel="stylesheet" href="css/login-page.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="loginHeading">
            <a href="login.html" class="auth-logo">
                <img src="assets/images/hello_solar.png" alt="Hello Solar">
            </a>

            <header class="auth-header">
                <span class="eyebrow">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    Customer Portal
                </span>
                <h1 id="loginHeading">Welcome <span>back.</span></h1>

            </header>

            <form class="auth-form" id="loginForm" novalidate>
                <!-- Error Alert Box -->
                <div class="error-msg" id="loginErrorMsg" role="alert">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="loginErrorText">Invalid email, account ID, or password. Please try again.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Email or Account ID</label>
                    <div class="input-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input class="form-input" id="username" name="username" type="text"
                            placeholder="e.g. customer@hellosolar.ph" autocomplete="username"
                            value="customer@hellosolar.ph" required>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="form-label" for="password">Password</label>
                        <a href="#" id="forgotPasswordLink"
                            style="font-size: 12.5px; color: var(--solar-orange-dark); font-weight: 600;">Forgot
                            Password?</a>
                    </div>
                    <div class="input-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input class="form-input" id="password" name="password" type="password"
                            placeholder="Enter password" autocomplete="current-password" value="password123" required>
                        <button type="button" class="password-toggle-btn" id="passwordToggle"
                            aria-label="Toggle password visibility">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary auth-btn" id="loginBtn">
                    <span id="loginBtnText">Log In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account yet?
                <a href="signup.html">Sign up</a>
            </p>
        </section>
    </main>

    <!-- Customer Authentication Logic & Registry -->
    <script src="../shared/hello-solar-config.js"></script>
    <script src="../hello_solar_super_admin/data.js"></script>
    <script src="../shared/hello-solar-shared.js"></script>
    <script src="js/auth.js"></script>

    <!-- Shared Data Loader -->
    <script src="js/data-loader.js"></script>

    <!-- Core Portal JavaScript -->
    <script src="js/portal.js"></script>

    <script src="js/login-page.js"></script>
</body>

</html>
