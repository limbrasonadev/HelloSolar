      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
  </defs>
  <!-- Top Ray -->
  <line x1="18" y1="3" x2="18" y2="7.5" stroke="url(#solarGrad)" stroke-width="3.5" stroke-linecap="round" />
