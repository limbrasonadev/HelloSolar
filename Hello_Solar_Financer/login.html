<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Log in to your Hello Solar Financer portal to review solar financing applications, manage approvals, and track project disbursements.">
    <title>Hello Solar Financer — Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo_tab.png">
    <link rel="apple-touch-icon" href="assets/images/logo_tab.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="css/portal.css">

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="loginHeading">
            <!-- Brand Logo -->
            <a href="login.html" class="auth-logo" title="Hello Solar Financer Portal">
                <img src="assets/images/hello_solar.png" alt="Hello Solar">
            </a>

            <!-- Header -->
            <header class="auth-header">
                <span class="eyebrow">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    Financer Portal
                </span>
                <h1 id="loginHeading">Welcome <span>back.</span></h1>
            </header>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm" novalidate>
                <!-- Error Alert Box -->
                <div class="error-msg" id="loginErrorMsg" role="alert">
                    <svg class="login-error-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="loginErrorText">Invalid email, account ID, or password. Please try again.</span>
                </div>

                <!-- Username/Email Field -->
                <div class="form-group">
                    <label class="form-label" for="username">Email or Username</label>
                    <div class="input-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input class="form-input" id="username" name="username" type="text"
                            placeholder="e.g. financer@hellosolar.ph" autocomplete="username"
                            value="financer@hellosolar.ph" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <div class="login-password-label">
                        <label class="form-label" for="password">Password</label>
                        <a class="login-forgot-password" href="#" id="forgotPasswordLink">Forgot
                            Password?</a>
                    </div>
                    <div class="input-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input class="form-input" id="password" name="password" type="password"
                            placeholder="Enter password" autocomplete="current-password" value="password123" required>
                        <button type="button" class="password-toggle-btn" id="passwordToggle"
                            aria-label="Toggle password visibility">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span id="loginBtnText">Log In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>

            </form>

            <!-- Footer Switch -->
            <p class="auth-footer">
                Don't have a financer account yet?
                <a href="signup.html">Sign up</a>
            </p>
        </section>
    </main>

    <!-- Financer Authentication Logic -->
    <script src="../shared/hello-solar-config.js"></script>
    <script src="../hello_solar_super_admin/data.js"></script>
    <script src="../shared/hello-solar-shared.js"></script>
    <script src="js/auth.js"></script>

    <!-- Login Page Logic -->
    <script src="js/login.js"></script>
</body>

</html>
