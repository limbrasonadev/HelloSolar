<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Hello Solar Merchant Installers — Monitor technician crew deployment, field certifications, and installation milestones.">
    <title>Installers | Hello Solar Merchant</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo_tab.png">
    <link rel="apple-touch-icon" href="assets/images/logo_tab.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Design System Stylesheet -->
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
</head>

<body data-page="installers">
    <div class="app" id="app">
        <!-- Mobile Drawer Backdrop -->
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar" aria-label="Merchant navigation"></aside>

        <!-- Main Content Area -->
        <main class="main" id="main" tabindex="-1">
            <!-- Glassmorphism Topbar Header -->
            <header class="topbar">
                <div class="topbar-left">
                    <a href="dashboard.html" class="topbar-logo" aria-label="Hello Solar">
                        <img src="assets/images/hello_solar.png" alt="Hello Solar" class="topbar-logo-img">
                    </a>
                    <div class="topbar-subtitle">
                        <span id="topbarMerchantName">SolarTech Manila</span> · <span>Field Operations</span>
                    </div>
                </div>

                <div class="topbar-right">
                    <!-- Interactive Merchant Profile Avatar -->
                    <div class="profile" id="topbarProfile" role="button" tabindex="0" aria-haspopup="dialog"
                        aria-label="Merchant Profile & Settings" title="Click to view and update merchant profile">
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content" id="content">
                <!-- Clean Page Header -->
                <div class="page-header">
                    <div>
                        <h1 style="font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-0.01em;">Installers
                        </h1>

                    </div>
                </div>

                <!-- 3 Installer Crew Cards -->
                <section class="crews-grid" id="installerTeamsGrid" aria-label="Installer Teams">
                    <!-- Populated dynamically from merchant.json -->
                </section>

                <!-- Installation Jobs Panel -->
                <section class="panel-card" aria-labelledby="trackerHeading">
                    <div class="panel-header">
                        <div class="panel-title-group">
                            <h2 id="trackerHeading">Installation Jobs</h2>
                        </div>
                    </div>

                    <!-- Filter Toolbar -->
                    <div class="filter-bar">
                        <div class="search-box">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="search" id="installerSearch" placeholder="Find a customer or job..."
                                aria-label="Search installations">
                        </div>

                        <div class="filter-controls">
                            <label for="crewFilter" class="sr-only" style="display:none;">Assigned Team</label>
                            <select class="filter-select" id="crewFilter" aria-label="Filter by assigned team">
                                <option value="All">All Teams</option>
                                <option value="CREW-ALPHA">Team Alpha (Engr. Torres)</option>
                                <option value="CREW-BETA">Team Beta (Engr. David)</option>
                                <option value="CREW-GAMMA">Team Gamma (Engr. Valenzuela)</option>
                                <option value="Unassigned">Unassigned Only</option>
                            </select>

                            <!-- Hidden stageFilter to preserve dashboard.js filter execution without errors -->
                            <input type="hidden" id="stageFilter" value="All">
                        </div>
                    </div>

                    <!-- Simplified Installations Data Table -->
                    <div class="table-container">
                        <table aria-label="Active Solar Installations" class="installations-table">
                            <thead>
                                <tr>
                                    <th scope="col">Customer</th>
                                    <th scope="col">Team</th>
                                    <th scope="col">Status</th>
                                    <th scope="col" style="text-align:right;">Open</th>
                                </tr>
                            </thead>
                            <tbody id="installationsTableBody">
                                <!-- Populated dynamically from merchant.json -->
                            </tbody>
                        </table>
                    </div>

                    <!-- See More / See Less Toggle for Installation Tracker -->
                    <div class="panel-card-footer" id="installationsSeeMoreWrap" style="display:none;margin-top:14px;">
                        <button class="btn-toggle-expand" id="installationsToggleBtn" type="button"
                            aria-expanded="false">
                            <span id="installationsToggleText">See More</span>
                            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar (Screens <= 768px) -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
        <a href="dashboard.html" class="mobile-bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" />
            </svg>
            <span>Dashboard</span>
        </a>
        <a href="payments.html" class="mobile-bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="3" />
                <path d="M3 10h18M7 15h3" stroke-linecap="round" />
            </svg>
            <span>Payments</span>
        </a>
        <a href="installers.html" class="mobile-bottom-nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="m14.5 6.5 3-3 3 3-3 3m-2 0-6 6m-2 0-4 4 1 1 4-4m2-10 7 7" />
            </svg>
            <span>Installers</span>
        </a>
        <a href="support.html" class="mobile-bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                    d="M4 13v-2a8 8 0 0 1 16 0v2M6 18H5a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h1v5Zm12 0h1a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2h-1v5Zm0 0c0 2-2 3-5 3" />
            </svg>
            <span>Support</span>
        </a>
    </nav>

    <!-- Centralized Data Loading & Interactions -->
    <script src="../shared/hello-solar-config.js"></script>
    <script src="../hello_solar_super_admin/js/data.js"></script>
    <script src="../shared/hello-solar-shared.js"></script>
    <script src="assets/js/merchant_data.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/notifications.js"></script>
</body>

</html>
