<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register as a certified Hello Solar Merchant partner.">

    <title>Hello Solar Merchant — Create Account</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo_tab.png">
    <link rel="apple-touch-icon" href="assets/images/logo_tab.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fffdf9;
            color: #101a2e;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 12px 40px rgba(16, 26, 46, 0.08);
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .logo-link {
            display: inline-block;
            margin-bottom: 24px;
        }

        .logo-img {
            height: 38px;
            width: auto;
            display: block;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            font-style: normal;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ea580c;
            background: rgba(255, 138, 0, 0.08);
            padding: 5px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 800;
            color: #101a2e;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .auth-title span {
            color: #ff8a00;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .error-msg {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            color: #b91c1c;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .error-msg.visible {
            display: flex;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #101a2e;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #94a3b8;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            color: #101a2e;
            background: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .form-input.has-toggle {
            padding-right: 44px;
        }

        .form-input:focus {
            border-color: #ff8a00;
            box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.16);
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .password-toggle-btn:hover {
            color: #101a2e;
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff9e00 0%, #ff7700 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(255, 138, 0, 0.32);
            margin-top: 10px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 138, 0, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13.5px;
            color: #64748b;
        }

        .auth-footer a {
            color: #ff8a00;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .auth-footer a:hover {
            color: #ea580c;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 28px 20px;
                border-radius: 18px;
            }

            .auth-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-container">
        <!-- Logo -->
        <a href="login.html" class="logo-link" aria-label="Hello Solar Home">
            <img class="logo-img" src="assets/images/hello_solar.png" alt="Hello Solar">
        </a>

        <!-- Eyebrow Badge -->
        <div>
            <span class="eyebrow">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <line x1="12" y1="2" x2="12" y2="4"></line>
                    <line x1="12" y1="20" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                    <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="4" y2="12"></line>
                    <line x1="20" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
                    <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
                </svg>
                MERCHANT REGISTRATION
            </span>
        </div>

        <!-- Headline & Subtitle -->
        <h1 class="auth-title">Create your <span>account.</span></h1>
        <p class="auth-subtitle">Register to view your ongoing solar projects, manage contractor teams, and receive commission payouts.</p>

        <!-- Error Alert -->
        <div class="error-msg" id="signupErrorMsg" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="signupErrorText">Please review the required fields.</span>
        </div>

        <!-- Registration Form (No Duplicates) -->
        <form id="signupForm" novalidate>
            <!-- Full Name -->
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input class="form-input" id="fullName" name="fullName" type="text" placeholder="e.g. Maria Santos" required>
                </div>
            </div>

            <!-- Business / Company Name -->
            <div class="form-group">
                <label class="form-label" for="companyName">Business / Company Name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    <input class="form-input" id="companyName" name="companyName" type="text" placeholder="e.g. SolarTech Manila" required>
                </div>
            </div>

            <!-- Mobile Phone -->
            <div class="form-group">
                <label class="form-label" for="phone">Mobile Phone (GCash & SMS Alerts)</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <input class="form-input" id="phone" name="phone" type="tel" placeholder="0917 555 0199" required>
                </div>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input class="form-input" id="email" name="email" type="email" placeholder="e.g. maria.santos@gmail.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input class="form-input has-toggle" id="password" name="password" type="password" placeholder="Create password (min. 6 characters)" required>
                    <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input class="form-input has-toggle" id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" required>
                    <button type="button" class="password-toggle-btn" id="confirmPasswordToggle" aria-label="Toggle confirm password visibility">
                        <svg id="confirmEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" id="signupBtn">
                <span id="signupBtnText">Create Account</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <!-- Footer -->
        <p class="auth-footer">
            Already have a merchant account? <a href="login.html">Log in</a>
        </p>
    </main>

    <script src="../shared/hello-solar-config.js"></script>
    <script src="../hello_solar_super_admin/data.js"></script>
    <script src="../shared/hello-solar-shared.js"></script>
    <script>
        const signupForm = document.getElementById("signupForm");
        const fullNameInput = document.getElementById("fullName");
        const companyNameInput = document.getElementById("companyName");
        const phoneInput = document.getElementById("phone");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const passwordToggle = document.getElementById("passwordToggle");
        const confirmPasswordToggle = document.getElementById("confirmPasswordToggle");
        const eyeIcon = document.getElementById("eyeIcon");
        const confirmEyeIcon = document.getElementById("confirmEyeIcon");
        const signupBtn = document.getElementById("signupBtn");
        const signupBtnText = document.getElementById("signupBtnText");
        const signupErrorMsg = document.getElementById("signupErrorMsg");
        const signupErrorText = document.getElementById("signupErrorText");

        function showError(msg) {
            if (signupErrorMsg && signupErrorText) {
                signupErrorText.textContent = msg;
                signupErrorMsg.classList.add("visible");
            }
        }

        function hideError() {
            if (signupErrorMsg) {
                signupErrorMsg.classList.remove("visible");
            }
        }

        function toggleVisibility(input, icon) {
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            if (isPassword) {
                icon.innerHTML = `
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" y1="2" x2="22" y2="22"/>
                `;
            } else {
                icon.innerHTML = `
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        }

        passwordToggle.addEventListener("click", () => toggleVisibility(passwordInput, eyeIcon));
        confirmPasswordToggle.addEventListener("click", () => toggleVisibility(confirmPasswordInput, confirmEyeIcon));

        const SIGNUP_LABEL = signupBtnText.textContent;

        signupForm.addEventListener("submit", (e) => {
            e.preventDefault();
            hideError();

            const fullName = fullNameInput.value.trim();
            const companyName = companyNameInput.value.trim();
            const phone = phoneInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!fullName || !companyName || !phone || !email || !password || !confirmPassword) {
                showError("Please fill in all required fields.");
                return;
            }

            if (password.length < 6) {
                showError("Password must be at least 6 characters.");
                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                showError("Passwords do not match. Please re-enter.");
                confirmPasswordInput.focus();
                return;
            }

            signupBtn.disabled = true;
            signupBtnText.textContent = "Creating Account...";

            setTimeout(() => {
                // Registers a Pending Review merchant in the shared registry (no session).
                // Super Admin activates the account before it can log in.
                const result = window.HSShared
                    ? window.HSShared.registerPendingAccount("merchant", { name: companyName, contact: fullName, phone: phone, email: email, password: password })
                    : { ok: false, error: "Account registration is unavailable right now. Please try again later." };
                if (!result.ok) {
                    signupBtn.disabled = false;
                    signupBtnText.textContent = SIGNUP_LABEL;
                    showError(result.error);
                    emailInput.focus();
                    return;
                }

                signupBtnText.textContent = "Account Submitted ✓";
                signupBtn.style.background = "#059669";
                showError("Account " + result.account.id + " is pending Hello Solar review. You can log in once it is activated.");

                setTimeout(() => {
                    window.location.replace("login.html");
                }, 2200);
            }, 600);
        });
    </script>
</body>

</html>
