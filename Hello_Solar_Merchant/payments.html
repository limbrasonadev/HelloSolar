<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Hello Solar Merchant Payments — Review commission disbursements, milestone approvals, and tax certificates.">
    <title>Payments | Hello Solar Merchant</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo_tab.png">
    <link rel="apple-touch-icon" href="assets/images/logo_tab.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Design System Stylesheet -->
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
</head>

<body data-page="payments">
    <div class="app" id="app">
        <!-- Mobile Drawer Backdrop -->
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar" aria-label="Merchant navigation"></aside>

        <!-- Main Content Area -->
        <main class="main" id="main" tabindex="-1">
            <!-- Glassmorphism Topbar Header -->
            <header class="topbar">
                <div class="topbar-left">
                    <a href="dashboard.html" class="topbar-logo" aria-label="Hello Solar">
                        <img src="assets/images/hello_solar.png" alt="Hello Solar" class="topbar-logo-img">
                    </a>
                    <div class="topbar-subtitle">
                        <span id="topbarMerchantName">SolarTech Manila</span> · <span>Commission Ledger</span>
                    </div>
                </div>

                <div class="topbar-right">
                    <!-- Interactive Merchant Profile Avatar -->
                    <div class="profile" id="topbarProfile" role="button" tabindex="0" aria-haspopup="dialog"
                        aria-label="Merchant Profile & Settings" title="Click to view and update merchant profile">
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content" id="content">
                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1 style="font-size:24px;font-weight:800;color:var(--black);letter-spacing:-0.01em;">Payments</h1>
                    </div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary btn-sm" id="exportCsvBtn" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Download CSV
                        </button>
                    </div>
                </div>

                <!-- 4 Simplified Financial Summary Cards -->
                <section class="stats-grid" aria-label="Financial Overview">
                    <div class="stat-card">
                        <span class="stat-label">Total Paid</span>
                        <div class="stat-value" id="payTotalPaid">—</div>
                    </div>

                    <div class="stat-card">
                        <span class="stat-label">Pending Payouts</span>
                        <div class="stat-value" id="payPendingReview">—</div>
                    </div>

                    <div class="stat-card">
                        <span class="stat-label">On Hold</span>
                        <div class="stat-value" id="payOnHold">—</div>
                    </div>

                    <div class="stat-card">
                        <span class="stat-label">Next Release</span>
                        <div class="stat-value" id="payNextRelease">Sept 15, 2026</div>
                    </div>
                </section>

                <!-- Payout Ledger Panel -->
                <section class="panel-card" aria-labelledby="payoutLedgerHeading">
                    <div class="panel-header">
                        <div class="panel-title-group">
                            <h2 id="payoutLedgerHeading">Payouts</h2>
                        </div>
                    </div>

                    <!-- Filter Toolbar -->
                    <div class="filter-bar">
                        <div class="search-box">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="search" id="payoutSearch"
                                placeholder="Find a payout or project..." aria-label="Search payouts">
                        </div>

                        <div class="filter-controls">
                            <label for="payoutStatusFilter" class="sr-only" style="display:none;">Filter by
                                Status</label>
                            <select class="filter-select" id="payoutStatusFilter" aria-label="Filter payouts by status">
                                <option value="All">All Statuses</option>
                                <option value="Released">Released</option>
                                <option value="Pending Review">Pending</option>
                                <option value="On Hold">On Hold</option>
                            </select>
                        </div>
                    </div>

                    <!-- Simplified Payouts Table (Project, Amount, Status, Date, Open) -->
                    <div class="table-container">
                        <table aria-label="Merchant Payouts List" class="payouts-table">
                            <thead>
                                <tr>
                                    <th scope="col">Project</th>
                                    <th scope="col">Amount</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Date</th>
                                    <th scope="col" style="text-align:right;">Open</th>
                                </tr>
                            </thead>
                            <tbody id="payoutsTableBody">
                                <!-- Populated dynamically from merchant.json -->
                            </tbody>
                        </table>
                    </div>

                    <!-- See More / See Less Toggle for Payouts Table -->
                    <div class="panel-card-footer" id="payoutsSeeMoreWrap" style="display:none;margin-top:14px;">
                        <button class="btn-toggle-expand" id="payoutsToggleBtn" type="button" aria-expanded="false">
                            <span id="payoutsToggleText">See More</span>
                            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar (Screens <= 768px) -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
        <a href="dashboard.html" class="mobile-bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" />
            </svg>
            <span>Dashboard</span>
        </a>
        <a href="payments.html" class="mobile-bottom-nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="3" />
                <path d="M3 10h18M7 15h3" stroke-linecap="round" />
            </svg>
            <span>Payments</span>
        </a>
        <a href="installers.html" class="mobile-bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="m14.5 6.5 3-3 3 3-3 3m-2 0-6 6m-2 0-4 4 1 1 4-4m2-10 7 7" />
            </svg>
            <span>Installers</span>
        </a>
        <a href="support.html" class="mobile-bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                    d="M4 13v-2a8 8 0 0 1 16 0v2M6 18H5a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h1v5Zm12 0h1a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2h-1v5Zm0 0c0 2-2 3-5 3" />
            </svg>
            <span>Support</span>
        </a>
    </nav>

    <!-- Centralized Data Loading & Interactions -->
    <script src="../shared/hello-solar-config.js"></script>
    <script src="../hello_solar_super_admin/js/data.js"></script>
    <script src="../shared/hello-solar-shared.js"></script>
    <script src="assets/js/merchant_data.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/notifications.js"></script>
</body>

</html>
