<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Hello Solar Merchant partner portal.">

    <title>Hello Solar Merchant — Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo_tab.png">
    <link rel="apple-touch-icon" href="assets/images/logo_tab.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body,
        button,
        input,
        select,
        textarea {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fffdf9;
            color: #101a2e;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 12px 40px rgba(16, 26, 46, 0.08);
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .logo-link {
            display: inline-block;
            margin-bottom: 24px;
        }

        .logo-img {
            height: 38px;
            width: auto;
            display: block;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            font-style: normal;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ea580c;
            background: rgba(255, 138, 0, 0.08);
            padding: 5px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 800;
            color: #101a2e;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .auth-title span {
            color: #ff8a00;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .error-msg {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            color: #b91c1c;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .error-msg.visible {
            display: flex;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: #101a2e;
            margin-bottom: 8px;
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .label-row .form-label {
            margin-bottom: 0;
        }

        .forgot-link {
            font-size: 13px;
            font-weight: 700;
            color: #ff8a00;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .forgot-link:hover {
            color: #ea580c;
            text-decoration: underline;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #94a3b8;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14.5px;
            color: #101a2e;
            background: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .form-input.has-toggle {
            padding-right: 44px;
        }

        .form-input:focus {
            border-color: #ff8a00;
            box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.16);
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .password-toggle-btn:hover {
            color: #101a2e;
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff9e00 0%, #ff7700 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(255, 138, 0, 0.32);
            margin-top: 6px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 138, 0, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-demo {
            width: 100%;
            height: 46px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #ffffff;
            color: #101a2e;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .btn-demo:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .demo-box {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 12.5px;
            color: #475569;
            line-height: 1.5;
        }

        .demo-box strong {
            color: #101a2e;
        }

        .demo-box code {
            font-family: monospace;
            font-size: 12px;
        }

        .demo-box .acc-pill {
            color: #ea580c;
            font-weight: 600;
        }

        .demo-box .pass-code {
            display: inline-block;
            background: #ffffff;
            border: 1px solid #fed7aa;
            color: #ea580c;
            padding: 1px 6px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 2px;
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13.5px;
            color: #64748b;
        }

        .auth-footer a {
            color: #ff8a00;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .auth-footer a:hover {
            color: #ea580c;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 28px 20px;
                border-radius: 18px;
            }

            .auth-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-container">
        <!-- Logo -->
        <a href="index.html" class="logo-link" aria-label="Hello Solar Home">
            <img class="logo-img" src="assets/images/hello_solar.png" alt="Hello Solar">
        </a>

        <!-- Eyebrow Badge -->
        <div>
            <span class="eyebrow">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                MERCHANT PORTAL
            </span>
        </div>

        <!-- Headline & Subtitle -->
        <h1 class="auth-title">Welcome <span>back.</span></h1>


        <!-- Error Alert -->
        <div class="error-msg" id="loginErrorMsg" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="loginErrorText">Invalid email, username, or password. Please try again.</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            <!-- Email or Username -->
            <div class="form-group">
                <label class="form-label" for="username">Email or Username</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input class="form-input" id="username" name="username" type="text"
                        placeholder="merchant@hellosolar.ph" value="merchant@hellosolar.ph" autocomplete="username"
                        required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <div class="label-row">
                    <label class="form-label" for="password">Password</label>
                    <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
                </div>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input class="form-input has-toggle" id="password" name="password" type="password"
                        placeholder="Enter password" value="password123" autocomplete="current-password" required>
                    <button type="button" class="password-toggle-btn" id="passwordToggle"
                        aria-label="Toggle password visibility">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Primary Log In Button -->
            <button type="submit" class="btn-primary" id="loginBtn">
                <span id="loginBtnText">Log In</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

        </form>

        <!-- Footer -->
        <p class="auth-footer">
            Don't have a merchant account yet? <a href="signup.html">Sign up</a>
        </p>
    </main>

    <script src="../shared/hello-solar-config.js"></script>
    <script src="../hello_solar_super_admin/data.js"></script>
    <script src="../shared/hello-solar-shared.js"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");
        const eyeIcon = document.getElementById("eyeIcon");
        const loginBtn = document.getElementById("loginBtn");
        const loginBtnText = document.getElementById("loginBtnText");
        const quickDemoBtn = document.getElementById("quickDemoBtn");
        const forgotPasswordLink = document.getElementById("forgotPasswordLink");
        const loginErrorMsg = document.getElementById("loginErrorMsg");
        const loginErrorText = document.getElementById("loginErrorText");

        function showError(msg) {
            if (loginErrorMsg && loginErrorText) {
                loginErrorText.textContent = msg;
                loginErrorMsg.classList.add("visible");
            }
        }

        function hideError() {
            if (loginErrorMsg) {
                loginErrorMsg.classList.remove("visible");
            }
        }

        // Toggle password visibility
        passwordToggle.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            if (isPassword) {
                eyeIcon.innerHTML = `
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" y1="2" x2="22" y2="22"/>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        });

        // Forgot password simulation
        forgotPasswordLink.addEventListener("click", (e) => {
            e.preventDefault();
            alert("Password Reset Demo: In production, a secure reset link will be dispatched to your registered merchant email.");
        });

        // Login authentication execution
        function performLogin(usernameVal, passwordVal) {
            hideError();

            const user = (usernameVal || usernameInput.value).trim();
            const pass = passwordVal !== undefined ? passwordVal : passwordInput.value;

            if (!user) {
                showError("Please enter your email or username.");
                usernameInput.focus();
                return;
            }

            if (!pass) {
                showError("Please enter your password.");
                passwordInput.focus();
                return;
            }

            loginBtn.disabled = true;
            loginBtnText.textContent = "Verifying...";

            setTimeout(() => {
                // Merchant accounts only (shared registry): credentials and Active status are verified
                const result = window.HSShared
                    ? window.HSShared.authenticate("merchant", user, pass)
                    : { ok: false, error: "Sign-in is unavailable right now. Please try again later." };
                if (!result.ok) {
                    loginBtn.disabled = false;
                    loginBtnText.textContent = "Log In";
                    showError(result.error);
                    passwordInput.focus();
                    return;
                }
                window.HSShared.session.start("merchant", result.account, {
                    businessName: result.account.name || "",
                    contactPerson: result.account.contact || "",
                    merchantId: result.account.id
                });

                loginBtnText.textContent = "Access Granted ✓";
                loginBtn.style.background = "#059669";

                setTimeout(() => {
                    window.location.replace("dashboard.html");
                }, 350);
            }, 400);
        }

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            performLogin();
        });

        if (quickDemoBtn) {
            quickDemoBtn.addEventListener("click", () => {
                usernameInput.value = "merchant@hellosolar.ph";
                passwordInput.value = "password123";
                performLogin("merchant@hellosolar.ph", "password123");
            });
        }
    </script>
</body>

</html>
